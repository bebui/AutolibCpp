[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "automaton-lib"
dynamic = ["version"]
description = "Finite automata over integer symbols : regular expressions, operators, counting and sampling, weighted and multi-weighted automata, all in C++"
readme = "python/README.md"
license = "LGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSES/*.txt"]
authors = [{ name = "Julien Menana" }]
requires-python = ">=3.10"
keywords = ["automata", "regular expressions", "finite state machines", "weighted automata", "pareto"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Software Development :: Libraries",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/bebui/AutolibCpp"
Documentation = "https://bebui.github.io/AutolibCpp/python/"
Source = "https://github.com/bebui/AutolibCpp"
Issues = "https://github.com/bebui/AutolibCpp/issues"

[project.optional-dependencies]
test = ["pytest>=7", "numpy>=1.21"]

[tool.scikit-build]
minimum-version = "build-system.requires"
cmake.version = ">=3.25"
build-dir = "build/python/{wheel_tag}"
wheel.packages = ["python/autolib"]
# One wheel for every CPython from 3.12, through the stable ABI
wheel.py-api = "cp312"
sdist.exclude = ["build", "benchmarks", "tools", "tests/data", ".github"]

[tool.scikit-build.cmake.define]
AUTOLIB_BUILD_PYTHON = "ON"
AUTOLIB_BUILD_TESTS = "OFF"
AUTOLIB_BUILD_EXAMPLES = "OFF"
BUILD_SHARED_LIBS = "OFF"

[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "CMakeLists.txt"
regex = 'VERSION\s+(?P<value>\d+\.\d+\.\d+)'

[tool.pytest.ini_options]
testpaths = ["python/tests"]

[tool.cibuildwheel]
# CPython from 3.10 (one stable-ABI wheel from 3.12) and PyPy; no 32-bit builds
build = ["cp310-*", "cp311-*", "cp312-*", "cp313-*", "cp314-*", "pp311-*"]
enable = ["pypy"]
skip = ["*-win32", "*_i686", "cp310-win_arm64"]  # no CPython 3.10 for Windows on ARM
test-requires = ["pytest", "numpy; platform_python_implementation == 'CPython'"]
test-command = "pytest {project}/python/tests -q"
build-verbosity = 1

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
